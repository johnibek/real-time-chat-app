{% if message.body %}
    <span id="message-body">{{ message.body }}</span>

    {% if message.author == user %}
        <div class="mt-3">
            <a id="message-edit" class="cursor-pointer"
                hx-get="{% url "edit-message" message.id %}"
                hx-target="#message-body"
                hx-swap="innerHTML"
            >
                <i class="bi bi-pencil-fill"></i>
            </a>
            <a class="pl-2" href="{% url 'delete-message' message.id %}">
                <i class="bi bi-trash3-fill"></i>
            </a>
        </div>
    {% endif %}
{% elif message.file %}
    {% if message.is_image %}
        <img class="max-w-72 min-w-8" src="{{ message.file.url }}">
    {% else %}
        &#x1F4CE; <a class="cursor-pointer italic hover:underline" href="{{ message.file.url }}" download>{{ message.filename }}</a>
    {% endif %}
{% endif %}
