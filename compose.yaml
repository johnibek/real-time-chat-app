services:
  telegram-bot:
    build:
      context: .
    command: python users/bot.py
    depends_on:
      - chat-app
    env_file:
      - .env
  celery:
    build:
      context: .
    command: celery -A core worker -l info
    depends_on:
      - chat-app
      - cache
    env_file:
      - .env
  cache:
    image: redis:latest
    restart: always
    expose:
      - 6379
    command: redis-server
    volumes:
      - cache:/data

  db:
    image: postgres:17
    restart: always
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
  chat-app:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: chat-app
    depends_on:
      - db
      - cache
    env_file:
      - ./.env
    ports:
      - 8000:8000
    develop:
      watch:
        - action: rebuild
          path: .
          target: /app

volumes:
  postgres_data:
  cache:
    driver: local
